modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/zoom-packers/createaddition/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Create Fly: Crafts & Additions (NeoForge)"
iconFile = "icon_fly_port.png"
authors = "MRH0 (Create Crafts & Additions); chaevsfe (Create Fly port); Zoom Packers (NeoForge 26.3 port)"
displayURL = "https://github.com/chaevsfe/createaddition"
description = '''
Electrical age for Create: generate, store and transfer Forge Energy with wires, motors and machines.
Create Crafts & Additions, as ported to Create Fly by chaevsfe, running on NeoForge 26.3 with Zoompack 5's Create Fly port.
Unofficial: do not report issues from this build to the upstream developers.
'''

[[mixins]]
config = "createaddition.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "computercraft"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# SEMI (EMI for 26.3): recipe viewer pages for charging, rolling and liquid burning
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "${emi_version_range}"
ordering = "NONE"
side = "CLIENT"
