org.gradle.jvmargs = -Xmx4G
org.gradle.caching = true
org.gradle.configuration-cache = false

# Upstream Create Fly: Crafts & Additions version this branch is based on, plus the ZP5 port build
upstream_version = 1.7.2.1
port_build = zp5.2
mod_id = createaddition
maven_group = com.mrh0.createaddition
archives_base_name = createaddition-neoforge

# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
minecraft_version = 26.3
minecraft_version_range = [26.3,26.4)
neo_version = 26.3.0.89
neo_version_range = [26.3.0.89,)

# Create Fly, NeoForge 26.3 port (ZP5 mods/create-fly-neoforge). Its jar is copied into libs/ (see PORTING.md).
create_jar = create-fly-neoforge-6.0.9+neoforge-26.3.jar
create_version_range = [6.0.9,)

# CC: Tweaked for NeoForge 26.3 (Modrinth version id, 1.120.3), optional compat
cct_version = f9jfjeJH

# SEMI (Seasonal EMI, https://github.com/Pandaismyname1/SEMI): EMI for 26.3, optional client compat (compat/emi)
emi_version = 1.1.24-SNAPSHOT+26.3
emi_version_range = [1.1.24-SNAPSHOT,)
